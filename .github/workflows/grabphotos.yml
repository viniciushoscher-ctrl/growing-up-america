name: grabphotos
on:
  workflow_dispatch:
    inputs:
      name:
        description: "branch suffix (photos-NAME)"
        required: true
      queries:
        description: "queries separated by |"
        required: true
permissions:
  contents: write
jobs:
  grab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - env:
          QUERIES: ${{ inputs.queries }}
          NAME: ${{ inputs.name }}
        run: |
          IFS='|' read -ra Q <<< "$QUERIES"
          python pipeline/grab_photos.py out "${Q[@]}"
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git checkout --orphan "photos-$NAME" && git rm -rqf --cached . && git add out && git commit -qm "photos $NAME" && git push -f origin "photos-$NAME"
