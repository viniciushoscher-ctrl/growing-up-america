name: titles
# Read-only research: nostalgia videos, views vs channel size, to learn which titles get views.
on:
  workflow_dispatch:
    inputs:
      set:
        description: "nostalgia (our niche) or other (other niches, newest uploads, for trends)"
        required: true
        default: nostalgia
permissions:
  contents: write
concurrency: titles
jobs:
  titles:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q -U yt-dlp
      - run: python pipeline/title_research.py
        env:
          SET: ${{ inputs.set }}
      - name: Save the results
        if: always()
        run: |
          git config user.name "research-bot" && git config user.email "research-bot@users.noreply.github.com"
          git add research 2>/dev/null || exit 0
          git diff --cached --quiet || (git commit -qm "research: title outliers" && git pull -q --rebase && git push)
